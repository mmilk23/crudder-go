#.github\workflows\container-scan.yml
name: Container Scan

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/container-scan.yml"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "11 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t crudder-go:scan -f Dockerfile .

      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "crudder-go:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
